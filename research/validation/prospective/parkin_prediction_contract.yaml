primary_validation_axis: LOCOMOTOR_IMPAIRMENT_DIRECTION
expected_direction: VIRTUAL_PARKIN_IMPAIRED_RELATIVE_TO_VIRTUAL_CONTROL
primary_success_rule: directional_concordance == true
quantitative_cross_assay_threshold: NOT_APPLICABLE_ASSAY_MISMATCH

parameter:
  name: neural_perturbation_strength
  values: [0.0, 0.25, 0.5, 0.75, 1.0]
  interpretation: Dimensionless computational sensitivity value; not a biological percentage.
  biological_percentage_mapping: NOT_ALLOWED
  selection_policy: PREREGISTERED_GRID_NO_SINGLE_BIOLOGICAL_PARAMETER
  biological_parameter_equivalence: NOT_ASSERTED
  posthoc_selection_allowed: false
  primary_parameter_selected: false

parameter_policy:
  type: PREREGISTERED_GRID
  biological_parameter_equivalence: NOT_ASSERTED
  posthoc_selection_allowed: false
  healthy_identity_parameter: 0.0
  disease_parameters: [0.25, 0.5, 0.75, 1.0]

paired_seed_policy: same seed healthy versus each Parkin parameter
frame_is_statistical_replicate: false
virtual_primary_metric: median_planar_speed_mm_s
virtual_secondary_metric: distance_traveled_mm
primary_direction_rule: median over paired seeds of (Parkin speed - healthy speed) < 0 for each nonzero parameter
grid_level_decision_rule: VIRTUAL_DIRECTIONAL_PREDICTION_SUPPORTED only when every nonzero parameter passes the primary direction rule and QC
mixed_direction_decision: DIRECTIONAL_VALIDATION_INCONCLUSIVE
no_consistent_impairment_decision: DIRECTIONAL_VALIDATION_NOT_SUPPORTED

virtual_metrics:
  - median_planar_speed_mm_s
  - distance_traveled_mm
  - displacement_mm
statistical_unit: seed
frame_is_replicate: false
statistical_method: Report per-seed values, mean, sample SD, SE and descriptive ratios; no post-hoc threshold or p-value claim.

failure_policy:
  disease_greater_or_equal_healthy: DIRECTIONAL_VALIDATION_NOT_SUPPORTED
  strong_between_seed_variation: DIRECTIONAL_VALIDATION_INCONCLUSIVE
  disease_less_than_healthy_consistently: VIRTUAL_DIRECTIONAL_PREDICTION_SUPPORTED
  relabel_failed_prediction: FORBIDDEN

secondary_analyses:
  - distance effect ratios
  - magnitude of virtual speed reduction
  - monotonicity across computational perturbation levels
  - seed variability
  - trajectories
  - contact/joint QC
secondary_outcomes_cannot_override_primary: true

holdout_opened: false
calibration_data_reused: false
tuning_using_holdout: false
