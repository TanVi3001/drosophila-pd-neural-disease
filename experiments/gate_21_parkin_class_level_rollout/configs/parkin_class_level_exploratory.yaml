schema_version: gate-21-parkin-class-level-exploratory-v1
gate: Gate 21
condition_id: parkin
gene_model: parkin_loss_of_function_class_level_exploratory
mapping_scope: class_level_exploratory
gene_specific_mapping: false
allowed_rollout_scope: CLASS_LEVEL_EXPLORATORY_ONLY
source_mapping_csv: research/disease_mapping/manual_imports/parkin/codex_export.csv
reviewer_signoff: research/disease_mapping/manual_imports/parkin/reviewer_signoff.json
healthy_baseline_manifest: experiments/gate_11_healthy_baseline/manifests/healthy_baseline_manifest.json
runtime:
  seeds: [0, 1, 2, 3, 4]
  step_count: 5000
  timestep_s: 0.0001
  age_days: 20.0
  device: cuda
  stimulus: p9
  cpg_frequency_hz: 12.0
  video_fps: 60
  video_width: 640
  video_height: 360
  video_playback_speed: 0.2
  video_camera_mode: tracking
burden_levels:
  - value: 0.0
    label: control
  - value: 0.25
    label: low
  - value: 0.5
    label: medium
  - value: 0.75
    label: high
  - value: 1.0
    label: full
exploratory_full_burden_parameters:
  presynaptic_gain: 0.75
  postsynaptic_gain: 0.75
  neuron_survival: 0.5
  energy_capacity: 0.75
  energy_consumption_scale: 1.25
  noise_std: 0.0
  action_delay_steps: 0
video:
  seeds: [0]
  burdens: [0.0, 1.0]
  retain_raw: false
scientific_boundary:
  - This is an organism-level/class-level exploratory neural perturbation.
  - It is not Parkin gene-specific validation.
  - Burden parameters are declared computational proxies, not literature measurements.
  - No calibration, holdout validation, diagnosis, drug response, or biological validation is performed.
