schema_version: gate-12f-b-action-hook-integration-v2
status: PLATFORM_PROTOCOL_CONNECTED

current_repo:
  path: ../drosophila-pd-neural-disease
  operator_module: src/drosophila_pd_neural/platform_perturbation.py:ProxyBurdenPerturbation
  adapter_module: src/drosophila_pd_neural/action_hook_adapter.py

external_runtime:
  path: ../drosophila-pd-flygym
  protocol_file: src/drosophila_pd/perturbations/base.py
  hook_file: src/drosophila_pd/experiments/healthy_baseline.py
  canonical_runner: scripts/run_healthy_baseline.py
  hook_discovered: true

platform:
  source_patch_required: false
  protocol: "src/drosophila_pd/perturbations/base.py: Perturbation"
  action_hook: "src/drosophila_pd/experiments/healthy_baseline.py:run_locomotion"

hook:
  action_producer: controller.step
  action_type: LocomotionAction
  joint_angles_shape: [42]
  adhesion_onoff_shape: [6]
  integration_point: perturbation.apply_to_action after controller.step and before apply_locomotion_action
  physics_step: sim.step()

operator:
  config: experiments/gate_12e_proxy_operator/configs/proxy_burden_action_operator.yaml
  applies_to: joint_angles
  modifies_adhesion_onoff: false
  burden_range: [0.0, 1.0]
  source_patch_required: false

forbidden:
  full_rollout: true
  calibration: true
  holdout_validation: true
  chen_tuning: true
  pozo_tuning: true
  biological_validation_claim: true
  gene_specific_claim: true
