schema_version: gate-14b-pozo-holdout-run-config-v1
status: RUN_POZO_RATIO_HOLDOUT

source:
  gate_14a_protocol: experiments/gate_14a_pozo_holdout_protocol/configs/pozo_holdout_protocol.yaml
  gate_14a_manifest: experiments/gate_14a_pozo_holdout_protocol/manifests/pozo_holdout_protocol_manifest.json
  calibrated_config: experiments/gate_13b_chen_ratio_calibration/configs/calibrated_alpha_synuclein_proxy.yaml
  gate_13c_manifest: experiments/gate_13c_calibrated_confirmation/manifests/calibrated_confirmation_manifest.json
  pink1_proxy_config: experiments/gate_12c_computational_proxy_configs/configs/pink1_proxy_condition.yaml
  operator_config: experiments/gate_12e_proxy_operator/configs/proxy_burden_action_operator.yaml
  action_hook_integration_manifest: experiments/gate_12f_b_action_hook_integration/manifests/action_hook_integration_manifest.json

external_runtime:
  path: ../drosophila-pd-flygym
  brain_root: external/fly-brain
  brain_python: ../drosophila-pd-flygym/.venv/Scripts/python.exe
  runner_file: scripts/run_brain_body_rollout.py
  patch_required: true
  require_cuda: true

holdout_scope:
  source: Pozo 2022
  model: Pink1B9
  condition_id: pink1
  proxy_scope: organism_level_proxy
  gene_specific_mapping: false
  biological_validation_claim: false

locked_parameter:
  parameter_name: proxy_burden_level
  selected_value: 0.5
  locked: true
  source: Gate 13B/Gate 13C Chen-only calibration
  no_parameter_reselection: true
  no_pozo_tuning: true

holdout_design:
  type: independent_holdout_ratio_evaluation
  control_burden_level: 0.0
  holdout_burden_level: 0.5
  seeds: [12, 13, 14, 15, 16, 17]
  planned_runs: 12
  no_tuning: true
  no_calibration: true

runtime:
  step_count: 5000
  timestep_s: 0.0001
  duration_s: 0.5
  preserve_physics: true
  preserve_timestep: true
  preserve_duration: true

pozo_target:
  primary_metric: distance_traveled_mm
  disease_value_mm: 62.091
  control_value_mm: 323.326
  target_ratio: 0.19203837612811836
  spread_reported: 61.288
  spread_policy: kept_as_reported_not_converted_to_sd_or_se
  n: 21
  allocation: holdout
  not_speed_target: true
  absolute_distance_role: reference_only

endpoint_decision:
  primary_endpoint: distance_ratio_to_control
  simulated_ratio_formula: mean_distance_burden_0_5 / mean_distance_burden_0_0
  error_formula: abs(simulated_ratio - pozo_target_ratio)
  directionality_check: burden_0_5_distance_less_than_burden_0_0
  absolute_distance_role: reference_only
  no_posthoc_threshold_change: true

result_classification:
  runtime_pass_status: POZO_HOLDOUT_RUNTIME_PASS
  runtime_partial_status: POZO_HOLDOUT_RUNTIME_PARTIAL
  runtime_blocked_status: POZO_HOLDOUT_RUNTIME_BLOCKED
  scientific_status_values:
    - POZO_RATIO_HOLDOUT_CONCORDANT
    - POZO_RATIO_HOLDOUT_CONCORDANCE_REPORTED
    - POZO_RATIO_HOLDOUT_NOT_CONCORDANT
    - POZO_RATIO_HOLDOUT_REVIEW_REQUIRED
  note: "No numerical tolerance was pre-registered; report ratio error and directionality without post-hoc claims of strong validation."

forbidden:
  parameter_reselection: true
  pozo_tuning: true
  calibration_run: true
  use_pozo_for_calibration: true
  use_pink1_for_calibration: true
  distance_to_speed_conversion: true
  spread_to_se_conversion: true
  alpha_synuclein_recalibration: true
  gene_specific_claim: true
  biological_validation_claim: true
  clinical_validation_claim: true

output_policy:
  commit_small_metrics: true
  commit_logs: true
  commit_manifests: true
  commit_large_npz: false
  commit_videos: false
  commit_viewer_bundle: false
  commit_checkpoints: false
