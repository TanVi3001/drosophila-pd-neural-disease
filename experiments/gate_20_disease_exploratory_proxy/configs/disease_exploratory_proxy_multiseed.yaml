schema_version: gate-20-disease-exploratory-proxy-multiseed-v1
experiment_id: gate_20_disease_exploratory_proxy_multiseed
status: RUN_ORGANISM_LEVEL_PROXY_ONLY

paths:
  healthy_baseline_summary: results/healthy_baseline_gate19/healthy_baseline_summary.json
  platform_root: ../drosophila-pd-flygym
  platform_python: ../drosophila-pd-flygym/.venv/Scripts/python.exe
  platform_proxy_launcher: scripts/run_platform_proxy_experiment.py
  operator_config: experiments/gate_12e_proxy_operator/configs/proxy_burden_action_operator.yaml
  output_root: results/disease_exploratory_gate20

runtime:
  seeds: [0, 1, 2, 3, 4]
  steps: 5000
  timestep_s: 0.0001
  duration_s: 0.5
  device: cuda
  stimulus: p9
  cpg_frequency_hz: 12.0
  preserve_physics: true
  preserve_timestep: true
  preserve_duration: true
  preserve_seed_policy: true

conditions:
  - condition_id: alpha_synuclein
    scope: organism_level_proxy
    gene_specific_mapping: false
    burden_levels: [0.0, 0.25, 0.5, 0.75, 1.0]
  - condition_id: pink1
    scope: organism_level_proxy
    gene_specific_mapping: false
    burden_levels: [0.0, 0.25, 0.5, 0.75, 1.0]

operator:
  type: amplitude_attenuation
  apply_to: joint_angles
  preserves_adhesion_onoff: true
  deterministic_seeded: true
  predeclared_grid: true
  fitted_in_gate_20: false

metrics:
  required:
    - mean_planar_speed_mm_s
    - distance_traveled_mm
    - displacement_mm
    - planar_path_length_mm
    - planar_displacement_mm

quality_gate:
  require_platform_overall_pass: true
  require_structural_action_validation: true
  require_adhesion_preservation: true
  forbid_nan: true
  forbid_inf: true

scientific_boundary:
  scope: organism-level computational exploratory proxy
  gene_specific_mapping: false
  biological_parkinson_validation: false
  clinical_validation: false
  drug_validation: false
  calibration_run: false
  holdout_validation: false
