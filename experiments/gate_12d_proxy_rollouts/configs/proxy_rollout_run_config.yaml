schema_version: gate-12d-proxy-rollout-run-config-v1
status: RUN_PROXY_ROLLOUTS

source_configs:
  proxy_ready_plan: experiments/gate_12c_computational_proxy_configs/configs/disease_rollout_plan_proxy_ready.yaml
  healthy_baseline_manifest: experiments/gate_11_healthy_baseline/manifests/healthy_baseline_manifest.json

runtime:
  step_count: 5000
  timestep_s: 0.0001
  duration_s: 0.5
  preserve_physics: true
  preserve_timestep: true
  preserve_duration: true
  preserve_seed_policy: true

seeds:
  values: [0, 1, 2, 3, 4, 5]
  minimum_n: 6

conditions_to_run:
  - condition_id: alpha_synuclein
    config: experiments/gate_12c_computational_proxy_configs/configs/alpha_synuclein_proxy_condition.yaml
    scope: organism_level_proxy
    gene_specific_mapping: false
    burden_levels: [0.0, 0.25, 0.5, 0.75, 1.0]

  - condition_id: pink1
    config: experiments/gate_12c_computational_proxy_configs/configs/pink1_proxy_condition.yaml
    scope: organism_level_proxy
    gene_specific_mapping: false
    burden_levels: [0.0, 0.25, 0.5, 0.75, 1.0]

conditions_to_skip:
  - condition_id: parkin
    reason: BLOCKED_IN_GATE_12C
  - condition_id: dj1
    reason: BLOCKED_IN_GATE_12C
  - condition_id: lrrk2
    reason: BLOCKED_IN_GATE_12C

metric_contract:
  required:
    - mean_planar_speed_mm_s
    - distance_traveled_mm
    - displacement_mm
  raw_metrics_preserved: true

forbidden:
  calibration: true
  holdout_validation: true
  chen_tuning: true
  pozo_tuning: true
  distance_to_speed_conversion: true
  ci95_to_se_conversion: true
  gene_specific_claim: true
  biological_validation_claim: true

output_policy:
  commit_small_metrics: true
  commit_logs: true
  commit_manifests: true
  commit_large_npz: false
  commit_videos: false
  commit_viewer_bundle: false
  commit_checkpoints: false
