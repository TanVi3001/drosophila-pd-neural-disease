name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Gate28A/Gate28B provenance checks intentionally inspect pinned
          # historical commits, so a shallow checkout makes valid tests fail
          # with "bad object" or "commit unavailable" errors.
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Test
        run: pytest -q -rs -p no:cacheprovider
      - name: Check whitespace
        run: git diff --check
