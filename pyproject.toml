[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drosophila-pd-neural-disease"
version = "0.1.0"
description = "Mô hình perturbation neural có ràng buộc bằng bằng chứng cho locomotion Drosophila."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pypdf>=5.0"]
analysis = ["matplotlib>=3.8,<4"]
report = ["reportlab>=4.0", "pypdf>=5.0"]
brain = [
  "torch>=2.0",
  "pandas>=2.0",
  "pyarrow>=14.0",
]

[project.urls]
Repository = "https://github.com/TanVi3001/drosophila-pd-neural-disease.git"
Issues = "https://github.com/TanVi3001/drosophila-pd-neural-disease/issues"
Platform = "https://github.com/tuanwannafly/drosophila-pd-flygym.git"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
